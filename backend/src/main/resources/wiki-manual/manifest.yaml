# Wiki seed 清单 — 多空间版
# WikiManualSeeder 启动时幂等导入所有 seed 空间。
# 新增功能：加新 md + 在对应空间 pages 追加条目，bump 版本号 push 即自动导入。
#
# write_scope（2026-07-06 起，none 与 super_admin_only 语义已统一为"锁定"）:
#   none             — 锁定：任何人（含 admin/super_admin）都不可创建/写/改/删/发布，只能评论（平台使用手册）
#   super_admin_only — 锁定：同 none，任何人都不可写，只能评论（Release Notes）
#   all              — 所有登录用户可读/建/写/改/发布；delete 仅 admin/super_admin（Bug 反馈，防止误删他人反馈）
#
# read_only: true — 单页强制只读（如 Bug 反馈里的模板页，防止被修改）；等同于该页单独套用锁定语义

spaces:

  # ──────────────────────────────────────────
  # 1. 平台使用手册（锁定：任何人都不可写，只能评论）
  # ──────────────────────────────────────────
