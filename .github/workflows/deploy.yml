# GitHub Actions：在 GH runner（带宽充足）构建 backend/frontend 镜像，
# push 到 ghcr.io，再 SSH 到云服务器 pull + 重启。
# 服务器仅 pull 变更 layer，不再本地 --build。
name: Build & Deploy

on:
  push:
    branches: [development]      # 仅 development 分支推送触发，其他分支不构建
  workflow_dispatch: {}          # 也支持在 Actions 页面手动触发

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/yangdi611/cwgsyw-platform-backend
  FRONTEND_IMAGE: ghcr.io/yangdi611/cwgsyw-platform-frontend
  PLATFORM: linux/amd64        # 云服务器架构（amd64）

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write           # 允许 push 到 ghcr
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # 自动注入，无需手动配

      - name: Build & push backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          platforms: ${{ env.PLATFORM }}
          push: true
          build-args: |
            NEXT_PUBLIC_GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    env:
      AUTHORIZATION_DECISION_MODE: ${{ secrets.AUTHORIZATION_DECISION_MODE }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: AUTHORIZATION_DECISION_MODE
          script: |
            set -e
            cd ${{ secrets.SERVER_PROJECT_DIR }}
            git pull origin development
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull backend frontend
            docker compose -f docker-compose.prod.yml up -d --no-build backend frontend nginx
            docker image prune -f
