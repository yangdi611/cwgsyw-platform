version: 2

updates:
  - package-ecosystem: maven
    directory: /backend
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies, security]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      time: '03:15'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies, security]

  - package-ecosystem: maven
    directory: /backend
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: '03:30'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies, security]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: '03:45'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies, security]
